<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; }
        h1 { color: #333; }
        form { display: flex; gap: 8px; margin-bottom: 16px; }
        input[type=text] { flex: 1; padding: 8px; font-size: 16px; }
        button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between;
             padding: 8px; border-bottom: 1px solid #ddd; }
        a { color: red; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Мои задачи</h1>
    <form action="/add" method="post">
        <input type="text" name="title" placeholder="Новая задача..." required>
        <button type="submit">Добавить</button>
    </form>
    <ul>
        {% for task in tasks %}
        <li>
            <span>{{ task[1] }}</span>
            <a href="/delete/{{ task[0] }}">✕</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
